<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-fleettools">
  <defs><linearGradient id="fleettools" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EA580C"/><stop offset="1" stop-color="#7C2D12"/></linearGradient></defs>
  <rect width="256" height="256" rx="56" fill="url(#fleettools)"/>
  <!-- A sweep across a fleet: a row of small squares (repositories), the one
