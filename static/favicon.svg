    <rect x="40" y="70" width="32" height="32" rx="6"/><rect x="92" y="70" width="32" height="32" rx="6"/>
    <rect x="144" y="70" width="32" height="32" rx="6"/><rect x="196" y="70" width="20" height="32" rx="6"/>
    <rect x="40" y="154" width="32" height="32" rx="6"/><rect x="144" y="154" width="32" height="32" rx="6"/>
    <rect x="196" y="154" width="20" height="32" rx="6"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <rect x="87" y="149" width="42" height="42" rx="10"/>
    <path d="M40 128 H216"/>
  </g>
</svg>
