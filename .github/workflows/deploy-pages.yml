name: deploy-pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content,
  # the Hugo version or one of the actions below has to prove the site still
  # builds before it lands. A dependency bump with no workflow arrives with
  # "no checks", which is not the same thing as green.
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

# Deploys serialise with one another under the main group. A pull request gets
# a group of its own, so it neither waits behind a deploy nor holds one up.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build landing page
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    # Only main publishes. A pull request stops after the build above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ⛔ A GREEN DEPLOY IS NOT A SERVED PAGE. If the Pages source is a branch
      # (Jekyll) instead of GitHub Actions, the live site is the default
      # theme's rendering of README.md while this workflow reports success.
      # So look at the URL: Hugo writes its own generator meta.
      - name: The page that is served is the page we built
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "serving: $url"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 20 "$url" || true)
            # The pattern matches the MINIFIED output: `hugo --minify` drops
            # the quotes around an attribute name.
            case "$body" in
              *'content="Hugo'*) echo "Hugo, as built"; exit 0 ;;
            esac
            echo "attempt $i: not ours yet, waiting"
            sleep 10
          done
          echo "::error::$url is not serving this build."
          echo "Check Settings -> Pages: the source must be GitHub Actions, not a branch."
          exit 1
