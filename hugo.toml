baseURL = "https://go-fleettools.github.io/"
title = "go-fleettools"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design comes from the shared Hugo module
# github.com/go-fleettools/landingkit (this organisation's own repository).
# Its version is pinned in go.mod (Renovate bumps it), and kit.go keeps
# `go mod tidy` from deleting that requirement.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.37:1, bright on the dark background 5.43:1.
  base = "#7c2d12"
  deep = "#4c1b0b"
  bright = "#ea580c"
  shadow = "rgba(124,45,18,.7)"
  glow = "rgba(124,45,18,.6)"
  wash = "rgba(124,45,18,.10)"
  washDeep = "rgba(76,27,11,.06)"
  chipBg = "#fcebe2"
  chipBorder = "#f9cdb6"
  chipFg = "#4c1b0b"
  chipBgDark = "rgba(234,88,12,.14)"
  chipBorderDark = "rgba(234,88,12,.32)"
  chipFgDark = "#f3a379"
  statsEnd = "#fad7c5"
  bandText = "#fce4d8"

# The mantra strip. `mantracheck` on 2026-10-26, after fleettools v0.40.1 added
# its LICENSE: "HOLDS", 13 repositories, 0 with code not BSD-3-Clause, 0 with cgo
# signals; the one other licence is data (landingkit's Octicons, MIT), which
# gets its own chip.
[params.mantra]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "icons: MIT, Octicons"]

# One card per repository of the organisation. Every field is rendered by
# layouts/index.html. "label" is the latest tag read from the repository on the
# date in the comment above it; a repository with no tag says so.
#
# Tags read 2026-10-26, except modfloor's, read 2026-11-01 at its release.
#
# ⛔ modfloor's blurb carried a WRONG figure for a day: "904 of the 939 modules
# below 1.27.3 are installable". That count was true over a population holding
# 540 modules other projects publish, found inside our own work trees -- the
# owner test passed them and nothing asked whether we could push a fix to
# sigs.k8s.io/yaml. modfloor v0.5.0 sets those aside; the real figure is 262.
# A count on a card is a claim, and this one was published before anyone read
# the list it came from.
# ⛔ Only modfloor's is measured today, and the rest are a week old, because
# `tagcells` -- the fleet's own tool for exactly this -- cannot read this file:
# it looks for [[params.modules]] with `tag = "vX.Y.Z"`, and these cards are
# [[params.repos]] with `label =`. Run against this hugo.toml it answers
# "1 file(s), 0 cell(s), 0 stale" and exits 2, refusing to call nothing a pass.
# Teaching it the second shape comes in its own pull request, after which these
# labels are rewritten by measurement instead of by hand.
[[params.repos]]
  name   = "fleettools"
  status = "ready"
  label  = "v0.40.1"
  url    = "https://github.com/go-fleettools/fleettools"
  blurb  = "Sweeps across about 1800 repositories: which default branches are red, which runners stopped, which modules are ahead of their tag, which foreign judges the CI never installs, and which tests exist without ever running. One command per sweep, under `cmd/`."
[[params.repos]]
  name   = "landingkit"
  status = "ready"
  label  = "v0.12.0"
  url    = "https://github.com/go-fleettools/landingkit"
  blurb  = "The go-* landings' shared design as a Hugo module, and the command that derives a brand from a logo, checks a landing against the reference (text and pixels) and checks every link of the built site. This very landing uses it."
[[params.repos]]
  name   = "mutate"
  status = "ready"
  label  = "v0.7.0"
  url    = "https://github.com/go-fleettools/mutate"
  blurb  = "Proves that a test can fail: applies one exact source mutation, runs the suite, restores whatever happens, and exits 0 only when the suite went red. `mutsweep` asks the same of every refusal in a package."
[[params.repos]]
  name   = "prwait"
  status = "ready"
  label  = "v0.5.0"
  url    = "https://github.com/go-fleettools/prwait"
  blurb  = "Waits until a pull request's checks are finished, and refuses to call an empty check list a pass. Also waits for a branch or a workflow run."
[[params.repos]]
  name   = "staletools"
  status = "ready"
  label  = "v0.3.0"
  url    = "https://github.com/go-fleettools/staletools"
  blurb  = "Which installed Go tools were built with an older toolchain, and of those which actually parse Go source, because only for those is staleness a wrong answer. Also finds duplicates and older releases of themselves."
[[params.repos]]
  name   = "modfloor"
  status = "ready"
  label  = "v0.5.0"
  url    = "https://github.com/go-fleettools/modfloor"
  blurb  = "The Go toolchain floor a module declares, against the floor a fix requires: reads the published go.mod, where a consumer reads it, and says which modules are below — 262 of this fleet's own on 2026-11-01, every one of them installable. `--baseline` turns that into a gate, because a report that is red for ever is not one: it fails only for a module the recorded set does not have, and reports a module that LEFT the population apart from one that was fixed. `modfloor pseudo` fails when a fleet module is required at a pseudo-version."
[[params.repos]]
  name   = "unbounded"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-fleettools/unbounded"
  blurb  = "Which repositories read a ZIP entry or decode an image without a ceiling: the sweep that follows a fix across its siblings. Every hit is a lead, not a verdict."
[[params.repos]]
  name   = "fleetfind"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-fleettools/fleetfind"
  blurb  = "Which repository already does this? A live, dated inventory of every organisation, because a hand-kept capability map drifts."
[[params.repos]]
  name   = "landingdiff"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-fleettools/landingdiff"
  blurb  = "Which of a set of landing pages is the odd one out, by counting what each page puts in the shared design system."
[[params.repos]]
  name   = "fuzzrun"
  status = "ready"
  label  = "v0.1.0"
  url    = "https://github.com/go-fleettools/fuzzrun"
  blurb  = "Runs every Go fuzz target of a module, in parallel within a load budget, and reports crashers with the corpus file that reproduces them."
[[params.repos]]
  name   = "buildstamp"
  status = "ready"
  label  = "v0.1.0"
  url    = "https://github.com/go-fleettools/buildstamp"
  blurb  = "Reads the Go build information of any binary, WebAssembly included, and fails one built from a modified tree. `go version -m` answers \"unrecognized file format\" on a .wasm."
[[params.repos]]
  name   = ".github"
  status = "active"
  label  = "no tag"
  url    = "https://github.com/go-fleettools/.github"
  blurb  = "Shared community health files, Renovate runner and preset for the organisation. It has no release: it is configuration."
[[params.repos]]
  name   = "docs"
  status = "active"
  label  = "on main"
  url    = "https://go-fleettools.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): one page per repository, from each repository's README at its latest tag."
