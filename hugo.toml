baseURL = "https://go-fleettools.github.io/"
title = "go-fleettools"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design comes from the shared Hugo module
# github.com/go-fleettools/landingkit (this organisation's own repository).
# Its version is pinned in go.mod (Renovate bumps it), and kit.go keeps
# `go mod tidy` from deleting that requirement.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.37:1, bright on the dark background 5.43:1.
  base = "#7c2d12"
  deep = "#4c1b0b"
  bright = "#ea580c"
  shadow = "rgba(124,45,18,.7)"
  glow = "rgba(124,45,18,.6)"
  wash = "rgba(124,45,18,.10)"
  washDeep = "rgba(76,27,11,.06)"
  chipBg = "#fcebe2"
  chipBorder = "#f9cdb6"
  chipFg = "#4c1b0b"
  chipBgDark = "rgba(234,88,12,.14)"
  chipBorderDark = "rgba(234,88,12,.32)"
  chipFgDark = "#f3a379"
  statsEnd = "#fad7c5"
  bandText = "#fce4d8"

# The mantra strip. `mantracheck` on 2026-10-26, after fleettools v0.40.1 added
# its LICENSE: "HOLDS", 13 repositories, 0 with code not BSD-3-Clause, 0 with cgo
# signals; the one other licence is data (landingkit's Octicons, MIT), which
# gets its own chip.
[params.mantra]
  goarch = ["amd64", "arm64"]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "icons: MIT, Octicons"]

# One card per repository of the organisation. Every field is rendered by
# layouts/index.html. "label" is the latest tag read from the repository on the
# date in the comment above it; a repository with no tag says so.
#
# ⭐ The labels are no longer typed by hand. Rewrite them with
#
#     tagcells --org go-fleettools --write hugo.toml
#
# (go-fleettools/fleettools v0.67.0 or later, which reads `label =` in a
# [[params.repos]] block as well as `tag =` in [[params.modules]]). It asks
# `git ls-remote` for the highest vX.Y.Z of each repository, so it spends no
# REST budget, and it exits 2 rather than calling a file with no cell up to
# date. Last rewritten 2026-11-05: 11 cells, 11 read, 3 of them stale
# (fleettools v0.67.0 -> v0.78.0, landingkit v0.18.0 -> v0.20.0, modfloor
# v0.7.0 -> v0.8.0). Four days, three cells: a comment with a date is the one
# part of this file nothing checks, so the rewrite is the record and the date
# is only its label.
#
# ⛔ The tagcells that wrote those three said of ITSELF "STALE -- v0.73.0 is 6
# commit(s) behind", so its answer was checked against the repositories rather
# than taken: `git ls-remote --tags --sort=-v:refname` gives v0.78.0, v0.20.0
# and v0.8.0, and fleettools' v0.78.0 is abf3a287, the merge commit it was
# tagged on. A stale tool reporting staleness is exactly the reading that has
# to be confirmed somewhere else.
#
# ⛔ Until fleettools v0.67.0 that command could not read this file at all --
# it looked only for [[params.modules]]/`tag` -- so these thirteen labels,
# dated 2026-10-26 in this comment, had never once been checked by the tool
# that exists for exactly that. Three were stale when it first could look:
# fleettools v0.40.1 (really v0.67.0), landingkit v0.12.0 (v0.18.0) and
# modfloor v0.6.0 (v0.6.1). A date in a comment is not a measurement.
#
# ⛔ modfloor's blurb also carried a WRONG figure for a day: "904 of the 939
# modules below 1.27.3 are installable". That count was true over a population
# holding 540 modules other projects publish, found inside our own work trees --
# the owner test passed them and nothing asked whether we could push a fix to
# sigs.k8s.io/yaml. modfloor v0.5.0 sets those aside; the real figure is 262.
# A count on a card is a claim, and this one was published before anyone read
# the list it came from.
#
# Rewritten again 2026-11-21 (tagcells v0.152.0): 11 cells, 11 read, 4 stale
# (fleettools v0.128.0 -> v0.152.0, mutate v0.8.0 -> v0.13.0, prwait v0.10.0 ->
# v0.13.0, fuzzrun v0.2.0 -> v0.7.1). modfloor's cell was NOT among them: the
# v0.13.0 written by hand in the same change is the tag the repository holds,
# which is the instrument confirming the edit rather than the edit claiming it.
#
# Rewritten again 2026-11-22 (tagcells built from fleettools v0.138.0; buildstamp
# says the 19 commits since do not touch it): 11 cells, 11 read, 3 stale
# (fleettools v0.152.0 -> v0.153.0, prwait v0.13.0 -> v0.14.0, fuzzrun v0.7.1 ->
# v0.7.2). ⛔ This comment is written BY HAND, and its date is the one claim on
# this file that no tool checks: tagcells rewrites the labels below it and cannot
# see a sentence. Filed against tagcells, with the eleven prose claims on the
# documentation site that it is blind to for the same reason.
#
# ⛔ And modfloor's blurb carried a figure measured BEFORE v0.13.0 set aside the
# modules with no buildable Go package -- "269 of ours on 2026-11-01" counted a
# population a quarter of which nobody can install. The figures on the card now
# say which population they come from (914 modules, 777 below, 2026-11-21), and
# the one mode-specific number says so: over the local clones, only 11 of the
# 339 modules that left were exposures. A count on a card is a claim, and a
# count whose POPULATION moved under it is a claim about something else.
[[params.repos]]
  name   = "fleettools"
  status = "ready"
  label  = "v0.156.0"
  url    = "https://github.com/go-fleettools/fleettools"
  blurb  = "Sweeps across about 1800 repositories: which default branches are red, which runners stopped or run and fail, which modules are ahead of their tag, which foreign judges the CI never installs, and which tests exist without ever running. One command per sweep, under `cmd/`. It also ships **reusable workflows** a repository calls in nine lines, so a check runs where the change is made rather than in a report nobody opens: `go-floor.yml` fails a branch that lowers its `go` directive below the fleet's floor — the case a fleet-wide sweep structurally cannot catch, because a repository created below the floor arrives as new to the population. And `priorart` turns the same idea on the work itself: before starting a subject it reads a repository's **branches** — by name *and* head-commit subject — and its **issues and pull requests, open and closed**, and exits non-zero when the subject is already covered. It exists because three pieces of work were redone on one repository in a single day with \"search the tracker first\" already written down as a rule: the thought arrives as *let me fix this*, never as *let me check whether this is fixed*, so the check has to run rather than be remembered. A surface it could not read holds the gate shut **even when another surface found something**, because an answer not obtained is not a negative answer — and that last clause was the defect rather than the design: a branch match used to return \"already covered\" on a run whose tracker had answered HTTP 422 and been read by nobody, printing the warning above a verdict that said the opposite. The search is also **split at six terms**, since GitHub allows five operators and seven OR-ed clauses answered 422 outright — so the subjects that silently lost the tracker were the carefully written ones, which are the subjects most likely to have prior art. And `openfixed` lists the **open issues a merged pull request already addressed** (CLOSABLE with a closing keyword, REVIEW with none at all, REFS when the body wrote `Refs` and so asked for the issue to stay open), reports how many it searched, read and skipped, and closes only on request. ⛔ That third word is the fleet's own merge rule coming back around: `ghmerge` refuses a merge whose body mentions an issue and classifies it as neither closed nor kept, so every correctly written `Refs #N` became permanent REVIEW output and a bucket whose name means *a person decides* filled with decisions already made — 37 of 64 open issues in one organisation. REFS rows are still printed, because an author can write `Refs` and be wrong, but they are counted apart and sorted last, after the rows that still need a decision. `See #N` is **not** one of them: the keywords are close/fix/resolve and `ref(s)`, and `see #12` is precisely the phrasing the merge gate exists to refuse, so reading it as a decision would have silenced the audit for the one sentence the fleet rejects at merge time. `privscan` applies the same shape to what we publish *about ourselves*: three issues went out carrying a home directory, an account name and the name of an unpublished document, and an edit does not undo that — a forge keeps the original under \"edited\" — so it both **finds** (a file, a repository, a whole organisation, comments and titles included, which a code search does not index) and **fixes**, and the gate lives inside `ghissue` and `ghpr` (which since v0.129.0 also opens pull requests: `ghpr <owner/repo> create`) before the send, with a waiver that takes a reason rather than a boolean and stamps that reason into the published text. Its first run over 60 repositories reported 509 findings and almost all of them were the instrument: a package manager's prefix read as a person, a TeX `\\\\` read as a Windows share, a list of keyboard keys read as a home directory. Reading the real text took it to 45, with the single real disclosure unchanged throughout — which is why `--accounts` answers *whose* file system was named rather than how many lines matched. And `runson` answers which **runner images** the fleet stands on — 1226 of 1247 checkouts with workflows on `ubuntu-latest`, which upstream is moving to Ubuntu 26.04 inside a month-long window, so a red CI in that window can be the *image* moving while the repository did not. It reads checkouts and spends nothing of the shared API budget, and the price of reading a disk is **measured instead of disclaimed**: it counts how many of the checkouts it read are behind their remote — 842 of 1247, furthest 188 commits, and 405 more never fetched within the horizon, so not one is confirmed current — and states which way that makes the answer wrong, because a checkout predating a newly added workflow makes the count a floor, and an absence read off a stale disk looks exactly like an absence that is real. The sentence it replaced said only \"a clone can be months stale\", which tells a reader to distrust the number without telling them how much. And `editurl` asks whether a documentation site's *Edit this page on GitHub* link reaches the page's own source: **75 of the 97 sites that render one do not** — 64 name a repository that does not exist, 7 name the organisation's *code* repository rather than its docs one, and 4 double the language, so the href lands a signed-in reader in a *create a new file* editor at a path the site never serves. It reads the **repository** rather than the URL, and that is a measurement rather than a preference: GitHub's `/edit/` route authenticates *before* it resolves a path, so an anonymous request to an existing repository answers `302` to a login page whatever the path is, and a fetcher cannot tell a correct link from a broken one — it would have scored those 4 as healthy. Its own first run reported a site as broken hours after the fix had been published, because the distance to a remote was read from a copy nobody had fetched: that one is now gated for every tool in the repository, not just the one that made the mistake. Two gates landed on 2026-11-15, each because a rule that existed only as prose had been broken all day. `viaonly` asks **which calls bypass the wrapper they were supposed to go through**, and now also **which exit points never ask the question a function exists to ask** — a distinction with teeth, since an early `return` does not read as an exit and a `return` is not a call: the rule it enforces had been paid for four times in one repository. Its own first version let through exactly the shape it was written for, because it credited *this statement contains a question* rather than *this question is certainly evaluated*, so a question asked inside one `switch` case marked every later exit as having asked it — the defect's own second round, with the suite green. What caught that was recalculating a twenty-row table by hand, where **five of the twenty expectations were wrong**. And `ratewait` gives a caller the one thing the fleet did not have: **a legal way to wait for the shared REST budget to come back**. `flakescan` counts how often one test has failed across a repository's CI history, by lane, **reading every attempt of every run** — because a flake is the failure somebody re-runs, and a re-run paints the run green while the evidence stays in the attempt before it. That budget is per *user* and about twenty-five sessions draw on it, so a program meets a 403 it did nothing to cause, and the retry policy here answers `false` for *API rate limit exceeded* on purpose — it will not refill inside any backoff — which left nobody able to wait at all. ⛔ **Four rounds of review each found its loop unbounded in a new way, and the result is a rule about waiting rather than about one command: a predicate over a value the remote reports is not a bound you control.** *Strictly later than the last reset*, *later by at least the margin* and *strictly in the future* were each defeated by a reset that moves with the clock — the last measured at five readings in twelve seconds, about 1300 under a 65-minute deadline. What bounds it is a **count** of readings derived from the window the API's own body shows, three plus one per hour the deadline allows; flooring that division then refused a legitimate wait at `--timeout 59m`, and its own test had pinned the undercount **as the specification**, so a mutation raising the count was reported *caught* by an expectation that had moved with the defect. And `dashfix` unblocks a fleet's red Renovate pull requests one at a time: upstream Renovate turned `dependencyDashboard` into an object, so the validator exited 1 on every organisation's runner config for a reason the pull request's own diff did not show. It fixes that line on the pull request's branch and merges only when `prwait` says green, stops at a REST reserve and an hourly cap, skips a repository another session holds, and stops on the first refused command rather than retrying it another way. And `secretscan` finds the daemons that take a secret as a **plaintext value** (a config field, a flag, an environment variable, a unit file) instead of by reference: names are judged by their words, so `token_file` is a path and `max_tokens` is not a secret, a flag whose default is a path is a path, and findings are counted per repository rather than per clone. Its report opens with a denominator, and an unread clone is NOT READ, never clean."
[[params.repos]]
  name   = "landingkit"
  status = "ready"
  label  = "v0.38.0"
  url    = "https://github.com/go-fleettools/landingkit"
  blurb  = "The go-* landings' shared design as a Hugo module, and the command that derives a brand from a logo, checks a landing against the reference (text and pixels) and checks every link of the built site. This very landing uses it."
[[params.repos]]
  name   = "mutate"
  status = "ready"
  label  = "v0.13.0"
  url    = "https://github.com/go-fleettools/mutate"
  blurb  = "Proves that a test can fail: applies one exact source mutation, runs the suite, restores whatever happens, and exits 0 only when the suite went red. `mutsweep` asks the same of every refusal in a package — and a sweep now files a record per file it swept, keyed by that file's bytes, so `mutsweep -hook` refuses a `gitpush` sending a Go file whose refusals no sweep covered or whose record says SURVIVED. It was an analysis tool nothing failed without: over two days two sessions wrote \"break-checked\" over hand-made mutations while it sat installed, and the real sweep then found three refusals no test held, in code already merged. A red that is only a runtime panic gets its own verdict and is listed with the survivors, because a panic red is luck — the next change that enlarges a table makes the same mutant survive silently. ⛔ And nothing is written by truncation: a sweep killed by SIGKILL left a source file at **zero bytes**, 434 lines gone, so every mutation and every restore renames a temporary from the target's own directory and carries back the mode the file had, since a rename installs a new inode."
[[params.repos]]
  name   = "prwait"
  status = "ready"
  label  = "v0.15.0"
  url    = "https://github.com/go-fleettools/prwait"
  blurb  = "Waits until a pull request's checks are finished, and refuses to call an empty check list a pass — or a complete, all-green one, when a workflow run for the same commit is red. A check run exists per job, so a run that fails before creating one leaves nothing red and nothing pending: v0.5.0 passed a pull request whose `pages` and `playground` runs had both failed. It reads the runs for the head commit too, judging the latest of each workflow per event. Every verdict names the commit it judged, and a head that moves mid-wait is refused rather than followed: a wait that silently re-points at a push nobody asked about ends by printing a true statement about the wrong work. ⛔ A rate limit is not a verdict either — a quota refusal used to print where the verdict goes, under the exit status of a red check, so \"nothing could be measured\" read as \"the pull request is red\": it now has its own classification, holds for the reset the API advertises instead of spending the budget that is refusing, reports a secondary limit as deduced, and exits 3. ⛔ And one poll reads EVERY target, so `-interval` is not *how often to ask* but *how much of a shared budget to spend*: four waits at the 45-second default emptied the per-user REST quota twice in a day, and `prwait -repo O/R 78 79 80 82` costs exactly what those four processes cost. The default is now 45 s **per target**, capped at 5 minutes, printed with the reason and the override; past the cap the hourly cost is stated rather than held, and an explicitly given `-interval` is never scaled. The cost model was read from the code rather than assumed, which corrected the incident's own premise: a poll spends one GraphQL call for the check list and one REST call for the head commit's runs, not two REST calls, and the two budgets are separate and never summed. ⛔⛔ And that was right and not enough, because **a budget that is per USER cannot be paced per PROCESS**: the incident was four *processes*, one per pull request, each pacing itself perfectly for the one target it knew about. Since v0.15.0 a wait records itself in the user's cache directory — per user by construction, which is the quota's own granularity — and counts the targets the other live waits are already polling into its own interval, so four single-target waits cost what one four-target wait costs. Measured minutes after that release, the registry on one workstation held **eight live waits from eight different sessions**, each on a single pull request of a different repository: the incident's own shape, now visible and paced. It **warns and paces rather than refusing**, because a gate that locks twenty-five sessions out of the only tool they are told to wait with is a gate that gets switched off — by a flag, or by going back to the shell waiter this tool replaced. And nothing about the bookkeeping can fail a wait: no cache directory, an unreadable registry, a lock left behind by a killed process, each is a line printed beside the verdict and never an exit status. An entry is dropped when its deadline passes **or** when its process is gone, and *\"the process is gone\"* may only ever drop an entry the deadline would have kept — so a platform that cannot answer it says *\"cannot tell\"*, never \"dead\", since a wrong \"false\" would quietly empty the registry and restore exactly the pacing this removed. Also waits for a branch or a workflow run."
[[params.repos]]
  name   = "staletools"
  status = "ready"
  label  = "v0.4.0"
  url    = "https://github.com/go-fleettools/staletools"
  blurb  = "Which installed Go tools were built with an older toolchain, and of those which actually parse Go source, because only for those is staleness a wrong answer. Also finds duplicates and older releases of themselves."
[[params.repos]]
  name   = "modfloor"
  status = "ready"
  label  = "v0.13.0"
  url    = "https://github.com/go-fleettools/modfloor"
  blurb  = "The Go toolchain floor a module declares, against the floor a fix requires: reads the published go.mod, where a consumer reads it, and says which modules are below — 777 of 914 on 2026-11-21, living in 693 repositories, so the campaign is about 693 pull requests and not 777, and the 13 floors they declare are 13 `gopin --gomod --from X` runs of which two cover 668. A module with no buildable Go package is set aside and counted: a Hugo landing site's `go.mod` exists only to pin a theme module, nobody installs it, and the verdict was correct on its own terms and unusable — 339 modules left the population, and over the local clones only 11 of them were exposures, so the set-aside took a flattering numerator out of the clean column and not only noise out of the exposure one. The test is the packages, never the name: a `*.github.io` repository that ships Go code is still judged. `--baseline` turns the check into a gate, because a report that is red for ever is not one: it fails only for a module it measured and found CLEAN, and reports apart the modules that entered the population and those that left it. `modfloor pseudo` fails when a fleet module is required at a pseudo-version."
[[params.repos]]
  name   = "unbounded"
  status = "ready"
  label  = "v0.3.0"
  url    = "https://github.com/go-fleettools/unbounded"
  blurb  = "Which repositories read a ZIP entry or decode an image without a ceiling: the sweep that follows a fix across its siblings. Every hit is a lead, not a verdict."
[[params.repos]]
  name   = "fleetfind"
  status = "ready"
  label  = "v0.4.0"
  url    = "https://github.com/go-fleettools/fleetfind"
  blurb  = "Which repository already does this? A live, dated inventory of every organisation, because a hand-kept capability map drifts."
[[params.repos]]
  name   = "landingdiff"
  status = "ready"
  label  = "v0.3.0"
  url    = "https://github.com/go-fleettools/landingdiff"
  blurb  = "Which of a set of landing pages is the odd one out, by counting what each page puts in the shared design system."
[[params.repos]]
  name   = "fuzzrun"
  status = "ready"
  label  = "v0.9.0"
  url    = "https://github.com/go-fleettools/fuzzrun"
  blurb  = "Runs every Go fuzz target of a module, in parallel within a load budget, and reports crashers with the corpus file that reproduces them; audits which targets no workflow fuzzes, and exits 2 rather than 0 when it could decide none."
[[params.repos]]
  name   = "buildstamp"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-fleettools/buildstamp"
  blurb  = "Reads the Go build information of any binary, WebAssembly included, and fails one built from a modified tree. `go version -m` answers \"unrecognized file format\" on a .wasm."
[[params.repos]]
  name   = ".github"
  status = "active"
  label  = "no tag"
  url    = "https://github.com/go-fleettools/.github"
  blurb  = "Shared community health files, Renovate runner and preset for the organisation. It has no release: it is configuration."
[[params.repos]]
  name   = "docs"
  status = "active"
  label  = "on main"
  url    = "https://go-fleettools.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): one page per repository, from each repository's README at its latest tag."

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-fleettools.github.io/docs/"
  label = "Read the documentation →"
